<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
        // This handles deep links for SPAs:
        const redirect = sessionStorage.redirect;
        if (redirect) {
            delete sessionStorage.redirect;
            window.history.replaceState(null, null, redirect);
        }
    </script>
</head>

<body></body>

</html>
